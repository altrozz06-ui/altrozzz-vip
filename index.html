<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(180deg,#8e2de2,#4a00e0);
    color:white;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:40px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    padding:15px 35px;
    background:#fff;
    color:#6a11cb;
    text-decoration:none;
    border-radius:50px;
    font-weight:bold;
}

.card{
    background:rgba(255,255,255,0.15);
    margin:20px;
    padding:25px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

.features{
    list-style:none;
}

.features li{
    margin:15px 0;
    font-size:18px;
}

.telegram{
    text-align:center;
    padding:40px 20px;
}

.telegram img{
    width:100px;
    height:100px;
    border-radius:50%;
    margin-bottom:15px;
}

.footer{
    text-align:center;
    padding:20px;
    opacity:.8;
}
</style>
</head>

<body>

<section class="hero">
    <h1>PLATFORM ALERT 🚀</h1>
    <p>Join our community and get updates instantly.</p>
    <a href="#" class="btn">SIGN UP NOW</a>
</section>

<div class="card">
    <h2>Why Join?</h2>
    <ul class="features">
        <li>✅ Fast Support</li>
        <li>✅ Exclusive Updates</li>
        <li>✅ Community Access</li>
        <li>✅ Referral Benefits</li>
    </ul>
</div>

<div class="card telegram">
    <img src="https://via.placeholder.com/100" alt="">
    <h2>Telegram Contact</h2>
    <p>@yourusername</p>
    <br>
    <a href="https://t.me/yourusername" class="btn">
        SEND MESSAGE
    </a>
</div>

<div class="footer">
    © 2026 All Rights Reserved
</div>

</body>
</html>
